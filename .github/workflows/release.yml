name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Bump the version, commit and tag, create the GitHub Release with the
  # packed tarball, then stage the version on npm (npmPublish is false in
  # release.config.js, so semantic-release itself never touches the registry).
  #
  # Staging is NOT publishing: the version is not live. A maintainer reviews
  # it in the "Staged Packages" tab on npmjs.com (or via `npm stage list` /
  # `npm stage view`) and clicks Approve — which requires a 2FA challenge —
  # before it reaches the registry.
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # releases/ is gitignored, so each run starts from an empty dir and
      # semantic-release writes exactly one tarball. Any tarball present
      # means a release was cut this run.
      - name: Check for staged release
        id: check
        run: |
          if ls releases/*.tgz >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # Submits the version to npm's staging area for maintainer review.
      # No 2FA required here; the human approval happens on npmjs.com.
      - name: Stage on npm for review
        if: steps.check.outputs.released == 'true'
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm stage publish ./releases/*.tgz --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
