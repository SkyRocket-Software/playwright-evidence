name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Bump the version, commit and tag, create the GitHub Release with the
  # packed tarball, then stage the version on npm (npmPublish is false in
  # release.config.js, so semantic-release itself never touches the registry).
  #
  # Staging is NOT publishing: the version is not live. A maintainer reviews
  # it in the "Staged Packages" tab on npmjs.com (or via `npm stage list` /
  # `npm stage view`) and clicks Approve — which requires a 2FA challenge —
  # before it reaches the registry.
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release exits 0 both when it cuts a release as
      # warning rather than a failure.
      - name: Verify release was cut
        id: verify
        run: |
          if [ -z "$(ls releases/*.tgz 2>/dev/null)" ]; then
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "(no tags yet)")
            since=${last_tag}..
            [ "$last_tag" = "(no tags yet)" ] && since=""
            commits=$(git log --oneline ${since}HEAD 2>/dev/null)
            if [ -z "$commits" ]; then
              echo "::warning::no release cut — no new commits since ${last_tag}; skipping npm stage"
            else
              count=$(printf '%s\n' "$commits" | wc -l)
              echo "::warning::no release cut — none of the ${count} commit(s) since ${last_tag} have a feat:/fix: (or breaking) subject; skipping npm stage"
              echo "Commits semantic-release evaluated:"
              printf '%s\n' "$commits"
            fi
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release tarball present: $(ls releases/*.tgz)"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # Submits the version to npm's staging area for maintainer review.
      # Skipped when no release was cut (see the warning above).
      - name: Stage on npm for review
        if: steps.verify.outputs.released == 'true'
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm stage publish ./releases/*.tgz --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
