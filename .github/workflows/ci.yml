name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ./actions/setup
      - name: Lint
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./actions/setup
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: ./actions/setup
      # Browsers aren't covered by setup-node's pnpm cache, so cache them
      # separately. Keyed on the lockfile hash so a @playwright/test bump
      # re-downloads once.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests and generate evidence PDF
        run: pnpm run test:e2e
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-report
          path: e2e-output/evidence-report-*.pdf
          if-no-files-found: warn
          retention-days: 90
